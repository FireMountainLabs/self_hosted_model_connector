# The connector as an installable package: deployments that ship it pin this
# repository at a commit, so what a tenant runs is verifiably this tree.
# The backend is pinned exactly, not floored: a consumer that verifies the
# archive by hash must also be able to verify the one tool that unpacks it,
# and pip's isolated build would otherwise fetch whatever version a floor
# allows, with no hash (README, "Installing as a package").
[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "self-hosted-model-connector"
version = "3.2.0"
description = "Serve a model on your own network to your deployment, dialing out only."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
# No dependencies, and none will be added: the standard library only.
# Auditability is the feature - five files, nothing transitive to vet.
dependencies = []

[project.scripts]
model-connector = "model_connector.__main__:main"

[tool.setuptools]
packages = ["model_connector"]
