# Security scanning for a repository whose whole purpose is to be
# inspectable: the scans run in the open, on every change and weekly, so a
# reviewer sees not just clean source but a clean, current verdict.
#
# GitHub-hosted runners on purpose: this repository is public, and
# self-hosted runners on a public repository would let any fork's pull
# request execute code on private infrastructure. Hosted runners are free
# for public repositories, so there is no cost to trade against that risk.
#
# Three scans, all blocking:
#   - CodeQL      - static analysis of the Python source
#   - gitleaks    - committed secrets, full history (the binary, pinned and
#                   checksum-verified before it executes; the action wrapper
#                   requires a paid license for organization repositories)
#   - trivy       - known-vulnerability and misconfiguration scan of the
#                   repository tree (with no dependencies to carry, a finding
#                   here is a real one)
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, so a newly-published CVE surfaces without a push

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@486fec2a3ea2626afcd8c7e9208b4f515078dd7e  # codeql-bundle-v2.26.4
        with:
          languages: python
      - uses: github/codeql-action/analyze@486fec2a3ea2626afcd8c7e9208b4f515078dd7e  # codeql-bundle-v2.26.4

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans full git history, not just the tip
      # The download is verified against a pinned SHA-256 before it executes -
      # an unverified third-party binary has no place in the job whose purpose
      # is supply-chain assurance. SHA from the release's own checksums file;
      # bump both together.
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          VER=8.21.2
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  trivy:
    name: Vulnerabilities + misconfig (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          exit-code: "1"
          severity: CRITICAL,HIGH,MEDIUM
